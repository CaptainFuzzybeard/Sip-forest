<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sip</title>
<style>
  :root { --bg:#f6f5f1; --ink:#1f2a37; --quiet:#7b8391; --coral:#ff6b5a; --aqua:#34c3e0; --sun:#ffd166; --mint:#4fd1a5; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", "Nunito", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; display: grid; place-items: center;
    padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }
  main { display: grid; justify-items: center; gap: 14px; text-align: center; width: 100%; }
  svg.scene { width: min(92vw, 520px); height: auto; overflow: visible; }
  .it { transform-box: fill-box; transform-origin: 50% 100%; }
  .it.c { transform-origin: 50% 50%; }
  .fl { animation: bob 4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  #bl, #seed { transition: opacity 3s ease; }
  #rp { transform-box: fill-box; transform-origin: 50% 50%; }
  .status { font-size: 44px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .caption { min-height: 1.5em; font-size: 17px; color: var(--quiet); max-width: 30ch; }
  .ask { display: flex; gap: 10px; animation: pop .6s cubic-bezier(.3,1.7,.5,1); }
  .ask[hidden] { display: none; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  button { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; transition: transform .2s cubic-bezier(.3,1.6,.5,1); }
  button:hover { transform: translateY(-2px) scale(1.04); }
  button:active { transform: scale(.95); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .btn { font-size: 18px; padding: 14px 34px; border-radius: 980px; background: var(--coral); color: #fff; box-shadow: 0 8px 18px rgba(255,107,90,.3); }
  .pill { font-size: 14px; padding: 8px 16px; border-radius: 980px; background: var(--aqua); color: #fff; }
  .pill.no { background: none; color: var(--quiet); box-shadow: inset 0 0 0 1.5px #d9d8d2; }
  .quiet { background: none; color: var(--quiet); font-size: 15px; font-weight: 600; padding: 10px; }
  .foot { font-size: 13px; color: var(--quiet); display: grid; justify-items: center; gap: 2px; }
  .foot button { font-size: 13px; padding: 4px 8px; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .fl, .ask { animation: none; } button, #bl, #seed { transition: none; } }
</style>
</head>
<body>
<main>
  <svg class="scene" viewBox="0 0 400 260" role="img" aria-label="A small world that grows with every sip">
    <path d="M0 236 Q200 200 400 236 V260 H0Z" fill="#8fd3a9"/>
    <path d="M0 220 Q200 180 400 220 V260 H0Z" fill="#b4e6c6"/>
    <path d="M0 236 Q200 200 400 236 V260 H0Z" fill="#8fd3a9" opacity=".55"/>
    <ellipse id="seed" cx="200" cy="203" rx="7" ry="3.5" fill="#a9744f"/>
    <g id="items">
      <g data-main="1" data-y="200" transform="translate(200,200)">
        <g class="it" id="main" style="transform:scale(0)">
          <rect x="-5" y="-44" width="10" height="44" rx="3" fill="#a9744f"/>
          <circle cy="-62" r="28" fill="#4cc38a"/><circle cx="-18" cy="-48" r="18" fill="#3fae7a"/><circle cx="18" cy="-48" r="18" fill="#3fae7a"/><circle cy="-80" r="16" fill="#6fd08c"/>
          <circle cx="-8" cy="-70" r="8" fill="#fff" opacity=".18"/>
          <g id="bl" opacity="0"><circle cx="-14" cy="-60" r="3.5" fill="#ff8f7a"/><circle cx="10" cy="-72" r="3.5" fill="#ffd166"/><circle cx="20" cy="-46" r="3.5" fill="#ff8f7a"/><circle cx="-24" cy="-44" r="3.5" fill="#ffd166"/><circle cx="-4" cy="-88" r="3.5" fill="#ff9ecb"/></g>
        </g>
      </g>
    </g>
    <ellipse id="rp" cx="200" cy="202" rx="14" ry="4" fill="none" stroke="#34c3e0" stroke-width="2" opacity="0"/>
    <g transform="translate(200,10)"><path id="wd" d="M0 -9 C6 0 7 4 0 8 C-7 4 -6 0 0 -9Z" fill="#34c3e0" opacity="0"/></g>
  </svg>

  <div class="status" id="status" hidden>30:00</div>
  <p class="caption" id="caption">Water your world, one sip at a time.</p>
  <div class="ask" id="ask" hidden>
    <button class="pill" id="yes">I had a sip</button>
    <button class="pill no" id="no">Not yet</button>
  </div>
  <div>
    <button class="btn" id="start">Start</button>
    <button class="quiet" id="stop" hidden>Stop</button>
  </div>
  <div class="foot"><span id="count"></span><button class="quiet" id="reset">New world</button></div>
</main>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", INTERVAL = 30 * 60 * 1000, SNOOZE = 5 * 60 * 1000;
  const $ = id => document.getElementById(id);
  const items = $("items"), mainEl = $("main"), status = $("status"), caption = $("caption");
  const gy = x => 220 - 80 * (x / 400) * (1 - x / 400);
  const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const pick = (r, a) => a[Math.floor(r() * a.length)];
  const GREENS = ["#4cc38a", "#3fae7a", "#6fd08c"], BLOOM = ["#ff8f7a", "#ffd166", "#ff9ecb", "#b28cff"];
  const K = ["flower","sapling","grass","bush","flower","pine","mushroom","cloud","tree","flower","butterfly","sapling","pond","sun","pine","flower"];

  // ---- the world: sips 1-6 grow the first tree, every sip after adds something new
  function spec(n) {
    const r = rng(n * 7919 + 13), i = n - 7;
    let k = K[i % K.length]; if (i >= K.length && (k === "sun" || k === "pond")) k = "flower";
    let x = 24 + r() * 352;
    if (["tree","pine","sapling","bush","pond"].includes(k) && Math.abs(x - 200) < 44) x = 200 + (x < 200 ? -1 : 1) * (44 + r() * 30);
    x = Math.min(376, Math.max(24, x));
    let y = gy(x) + r() * 14;
    const s = .8 + r() * .5, c = pick(r, GREENS), b = pick(r, BLOOM), f = r() < .28;
    if (k === "cloud") y = 36 + r() * 44;
    if (k === "butterfly") y = gy(x) - 30 - r() * 50;
    if (k === "sun") { x = 338; y = 46; }
    return { k, x, y, s, c, b, f };
  }
  function shape({ k, s, c, b, f }) {
    const T = (m, inner, cls = "") => `<g class="it ${cls}"><g transform="scale(${s * m})">${inner}</g></g>`;
    const cc = f ? b : c;
    switch (k) {
      case "tree": case "sapling": return T(k === "sapling" ? .6 : 1, `<rect x="-3" y="-26" width="6" height="26" rx="2" fill="#a9744f"/><circle cy="-38" r="16" fill="${cc}"/><circle cx="-10" cy="-28" r="11" fill="${cc}"/><circle cx="10" cy="-28" r="11" fill="${cc}"/><circle cx="-5" cy="-42" r="6" fill="#fff" opacity=".25"/>`);
      case "pine": return T(1, `<rect x="-2" y="-8" width="4" height="8" fill="#a9744f"/><polygon points="0,-56 -15,-24 15,-24" fill="${c}"/><polygon points="0,-42 -19,-8 19,-8" fill="${c}"/>`);
      case "bush": return T(1, `<circle cx="-9" cy="-7" r="9" fill="${c}"/><circle cx="9" cy="-7" r="9" fill="${c}"/><circle cy="-12" r="10" fill="${c}"/>`);
      case "flower": return T(1, `<path d="M0 0V-15" stroke="#3fae7a" stroke-width="2" stroke-linecap="round"/><circle cy="-17" r="5.5" fill="${b}"/><circle cy="-17" r="2" fill="#fff6d6"/>`);
      case "grass": return T(1, `<path d="M-6 0Q-5 -9 -8 -12M0 0Q0 -11 2 -14M6 0Q5 -8 9 -10" stroke="#3fae7a" stroke-width="2" fill="none" stroke-linecap="round"/>`);
      case "mushroom": return T(1, `<rect x="-2" y="-7" width="4" height="7" rx="1.5" fill="#fff7e8"/><path d="M-8 -7A8 8 0 0 1 8 -7Z" fill="#ff6b5a"/><circle cx="-3" cy="-10" r="1.4" fill="#fff"/><circle cx="3" cy="-11" r="1.2" fill="#fff"/>`);
      case "pond": return T(1, `<ellipse rx="26" ry="6" fill="#7fd4f5"/><ellipse cy="-1" rx="16" ry="3" fill="#b5e8fb"/>`);
      case "cloud": return T(1.1, `<g class="fl"><circle cx="-14" r="10" fill="#d6ecff"/><circle cy="-6" r="13" fill="#d6ecff"/><circle cx="15" r="10" fill="#d6ecff"/></g>`, "c");
      case "butterfly": return T(.9, `<g class="fl"><ellipse cx="-5" cy="-3" rx="6" ry="4" fill="${b}"/><ellipse cx="5" cy="-3" rx="6" ry="4" fill="${b}"/><ellipse cx="-4" cy="3" rx="4" ry="3" fill="${b}" opacity=".75"/><ellipse cx="4" cy="3" rx="4" ry="3" fill="${b}" opacity=".75"/><rect x="-1" y="-6" width="2" height="12" rx="1" fill="#1f2a37"/></g>`, "c");
      case "sun": return `<g class="it c"><circle r="24" fill="#ffd166" opacity=".3"/><circle r="14" fill="#ffd166"/></g>`;
    }
  }
  function place(it, animate) {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("transform", `translate(${it.x.toFixed(1)},${it.y.toFixed(1)})`);
    g.dataset.y = it.y; g.innerHTML = shape(it);
    const inner = g.firstChild;
    if (animate) inner.style.transform = "scale(0)";
    items.insertBefore(g, [...items.children].find(k => +k.dataset.y > it.y) || null);
    if (animate) { inner.getBoundingClientRect(); inner.style.transition = "transform 4s cubic-bezier(.2,.8,.2,1)"; inner.style.transform = "scale(1)"; }
  }
  function setMain(n, animate) {
    mainEl.style.transition = animate ? "transform 4s cubic-bezier(.2,.8,.2,1)" : "none";
    mainEl.style.transform = `scale(${[0, .1, .22, .38, .55, .78, 1][Math.min(n, 6)]})`;
    $("bl").style.opacity = n >= 6 ? 1 : 0; $("seed").style.opacity = n === 0 ? 1 : 0;
  }
  const grow = n => n <= 6 ? setMain(n, true) : place(spec(n), true);

  // ---- saved state
  const dayKey = () => new Date().toDateString();
  let st = { sips: 0, day: dayKey(), today: 0 };
  try { Object.assign(st, JSON.parse(localStorage.getItem("sip-world")) || {}); } catch (e) {}
  if (st.day !== dayKey()) { st.day = dayKey(); st.today = 0; }
  const save = () => { try { localStorage.setItem("sip-world", JSON.stringify(st)); } catch (e) {} };
  const updateCount = () => $("count").textContent = st.sips ? `${st.today} today, ${st.sips} in this world` : "Your world is a seed";
  function build() { setMain(st.sips, false); for (let n = 7; n <= st.sips; n++) place(spec(n), false); updateCount(); }
  build();

  // ---- sound
  let ctx, out;
  function drop(t, vol, f0, f1) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 0.09);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.4);
  }
  function sound(low) {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      out = ctx.createGain(); out.gain.value = 0.7;
      const d = ctx.createDelay(), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
      d.delayTime.value = 0.17; fb.gain.value = 0.32; lp.type = "lowpass"; lp.frequency.value = 2400;
      out.connect(ctx.destination); out.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(ctx.destination);
    }
    ctx.resume().then(() => { const t = ctx.currentTime + 0.02; drop(t, 0.35, low ? 380 : 520, low ? 1000 : 1500); drop(t + 0.22, 0.14, low ? 500 : 700, low ? 1300 : 1900); });
  }

  // ---- watering
  function water(done) {
    $("wd").animate([{ transform: "translateY(0)", opacity: 0 }, { opacity: 1, offset: .15 }, { transform: "translateY(178px)", opacity: 1 }], { duration: 900, easing: "ease-in" }).onfinish = () => {
      $("rp").animate([{ transform: "scale(.2)", opacity: .9 }, { transform: "scale(2.6)", opacity: 0 }], { duration: 1200, easing: "ease-out" });
      done();
    };
  }

  // ---- timer
  let next = null, timer = null, wake = null, asking = false, remindAt = 0, msgUntil = 0;
  const fmt = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  const say = (t, ms) => { caption.textContent = t; msgUntil = Date.now() + ms; };
  function render() {
    const left = Math.max(0, next - Date.now());
    status.textContent = fmt(left);
    document.title = asking ? "💧 Sip?" : "💧 " + fmt(left);
    if (!asking && Date.now() > msgUntil) caption.textContent = left < 60000 ? "Almost sip time" : "until your next sip";
  }
  function ask() {
    sound(false); asking = true; remindAt = 0; msgUntil = 0;
    $("ask").hidden = false; caption.textContent = "Your world is thirsty. Did you take a sip?";
  }
  function tick() {
    const now = Date.now();
    if (now >= next) { next += INTERVAL; if (next < now) next = now + INTERVAL; ask(); }
    else if (remindAt && now >= remindAt) ask();
    render();
  }
  $("yes").onclick = () => {
    asking = false; remindAt = 0; $("ask").hidden = true; sound(true); say("Watering…", 6000);
    water(() => { st.sips++; st.today++; save(); grow(st.sips); updateCount(); say("Lovely. Your world grew a little.", 5000); });
  };
  $("no").onclick = () => { asking = false; $("ask").hidden = true; remindAt = Date.now() + SNOOZE; say("Okay, another nudge in 5 minutes.", 4000); };
  $("start").onclick = () => {
    sound(false); next = Date.now() + INTERVAL; msgUntil = 0;
    timer = setInterval(tick, 1000); status.hidden = false; render();
    navigator.wakeLock?.request("screen").then(w => wake = w).catch(() => {});
    $("start").hidden = true; $("stop").hidden = false;
  };
  $("stop").onclick = () => {
    clearInterval(timer); timer = null; next = null; asking = false; remindAt = 0;
    try { wake?.release(); } catch (e) {}
    $("ask").hidden = true; status.hidden = true; document.title = "Sip";
    caption.textContent = "Water your world, one sip at a time.";
    $("start").hidden = false; $("stop").hidden = true;
  };
  $("reset").onclick = () => {
    if (!confirm("Start a new world? The current one will be cleared.")) return;
    st = { sips: 0, day: dayKey(), today: 0 }; save();
    [...items.children].filter(k => !k.dataset.main).forEach(k => k.remove());
    setMain(0, false); updateCount();
  };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && timer) tick(); });
})();
</script>
</body>
</html>
